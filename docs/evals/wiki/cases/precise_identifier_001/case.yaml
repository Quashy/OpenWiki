id: precise_identifier_001
title: 精确编号不能改写或漏掉
purpose: 验证快递单号、预约码和订单号等精确字符串在页面中保持原样，并能被引用溯源。
tags:
  - precise-id
  - citation
  - factuality

wiki_config:
  auto_ingest: false
  llm_timeout_seconds: 60
  llm_max_retries: 3
  temperature: 0.2

documents:
  - path: documents/delivery-and-booking.md
    title: 快递与预约记录

questions:
  - id: q_delivery_tracking_code
    question: 快递取件的顺丰单号和取件码分别是什么？
    expected_behavior: answer
    expected_answer_contains:
      - SF-2026-0828-7781
      - 5739
    expected_citation_terms:
      - SF-2026-0828-7781
      - 取件码 5739
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - SF-2026-0828-7782
  - id: q_dental_booking_code
    question: 洗牙预约码和预约时间是什么？
    expected_behavior: answer
    expected_answer_contains:
      - DENTAL-4492
      - 2026-09-03 15:30
    expected_citation_terms:
      - DENTAL-4492
      - 2026-09-03 15:30
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - DENTAL-4493

expectations:
  must_have_pages:
    - slug: entity/parcel-pickup
      page_type: entity
      title_contains: 快递取件
    - slug: entity/dental-cleaning-booking
      page_type: entity
      title_contains: 洗牙预约
  must_not_have_pages:
    - slug: entity/sf-2026-0828
  must_have_aliases:
    entity/parcel-pickup:
      - 快递取件
      - SF-2026-0828-7781
    entity/dental-cleaning-booking:
      - 洗牙预约
      - DENTAL-4492
  must_have_citations:
    entity/parcel-pickup:
      min_count: 1
      required_terms:
        - SF-2026-0828-7781
    entity/dental-cleaning-booking:
      min_count: 1
      required_terms:
        - DENTAL-4492
  must_have_relations: []
  must_not_contain:
    - SF-2026-0828-7782
    - DENTAL-4493
    - chunk_
  max_dead_links: 0
  max_self_loops: 0
