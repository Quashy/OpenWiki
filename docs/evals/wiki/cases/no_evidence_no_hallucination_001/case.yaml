id: no_evidence_no_hallucination_001
title: 无证据内容不得编造
purpose: 验证宠物寄养说明没有提供价格、疫苗品牌和保险条款时，Wiki 不生成或暗示这些不存在的信息。
tags:
  - hallucination
  - no-evidence
  - pet-boarding

wiki_config:
  auto_ingest: false
  llm_timeout_seconds: 60
  llm_max_retries: 3
  temperature: 0.2

documents:
  - path: documents/pet-boarding-note.md
    title: 宠物寄养说明

questions:
  - id: q_pet_boarding_requirements
    question: 宠物寄养需要主人自带哪些东西？
    expected_behavior: answer
    expected_answer_contains:
      - 牵引绳
      - 日常狗粮
      - 常用药
    expected_citation_terms:
      - 自带牵引绳
      - 日常狗粮
      - 常用药
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - 疫苗品牌
  - id: q_pet_boarding_price_unknown
    question: 宠物寄养每晚多少钱，保险怎么赔付？
    expected_behavior: no_answer
    expected_answer_contains:
      - 无法从知识库确认
    expected_citation_terms:
      - 没有提供寄养价格、疫苗品牌、保险条款或赔付规则
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - 每晚 80 元
      - 元/天
      - 保险赔付

expectations:
  must_have_pages:
    - slug: entity/pet-boarding
      page_type: entity
      title_contains: 宠物寄养
  must_not_have_pages:
    - slug: entity/pet-boarding-price
    - slug: entity/vaccine-brand
    - slug: entity/insurance-policy
  must_have_aliases:
    entity/pet-boarding:
      - 宠物寄养
      - 寄养安排
  must_have_citations:
    entity/pet-boarding:
      min_count: 1
      required_terms:
        - 自带牵引绳
        - 不接受临时加餐
  must_have_relations: []
  must_not_contain:
    - 每晚
    - 元/天
    - 疫苗品牌
    - 保险赔付
    - chunk_
  max_dead_links: 0
  max_self_loops: 0
