id: citation_narrow_001
title: 引用必须指向实质证据段
purpose: 验证菜谱页面引用到包含具体温度和时间的段落，而不是只引用泛泛提到烤箱的背景段落。
tags:
  - citation
  - grounding
  - recipe

wiki_config:
  auto_ingest: false
  llm_timeout_seconds: 60
  llm_max_retries: 3
  temperature: 0.2

documents:
  - path: documents/lemon-cake-recipe.md
    title: 柠檬蛋糕食谱

questions:
  - id: q_lemon_cake_temperature_time
    question: 柠檬蛋糕需要用多少温度烤多久？
    expected_behavior: answer
    expected_answer_contains:
      - 175°C
      - 32 分钟
    expected_citation_terms:
      - 预热到 175°C
      - 烘烤 32 分钟
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - 180°C
      - 30 分钟左右
  - id: q_lemon_cake_last_minutes
    question: 柠檬蛋糕表面上色过快时应该怎么办？
    expected_behavior: answer
    expected_answer_contains:
      - 最后 8 分钟盖锡纸
    expected_citation_terms:
      - 最后 8 分钟盖锡纸
    expected_sources:
      min_count: 1
      allowed_types:
        - document
        - wiki_page
    must_not_contain:
      - 降低到 150°C

expectations:
  must_have_pages:
    - slug: entity/lemon-cake
      page_type: entity
      title_contains: 柠檬蛋糕
    - slug: concept/baking-temperature
      page_type: concept
      title_contains: 烘焙温度
  must_not_have_pages: []
  must_have_aliases:
    entity/lemon-cake:
      - 柠檬蛋糕
      - Lemon Cake
  must_have_citations:
    entity/lemon-cake:
      min_count: 1
      required_terms:
        - 175°C
        - 32 分钟
    concept/baking-temperature:
      min_count: 1
      required_terms:
        - 预热
        - 175°C
  must_have_relations:
    - source_slug: entity/lemon-cake
      target_slug: concept/baking-temperature
      relation_type_contains: 烘焙
  must_not_contain:
    - 180°C
    - 30 分钟左右
    - chunk_
  max_dead_links: 0
  max_self_loops: 0
